<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="240" viewBox="0 0 280 240">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#464b4a"/>
      <stop offset="0.16" stop-color="#9aa09b"/>
      <stop offset="0.40" stop-color="#dcdfd7"/>
      <stop offset="0.60" stop-color="#b6bbb4"/>
      <stop offset="0.84" stop-color="#6b7170"/>
