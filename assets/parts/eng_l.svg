  <path d="M196 60 C212 74 214 92 202 104" stroke="#151a1c" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M196 60 C212 74 214 92 202 104" stroke="url(#pipe)" stroke-width="9" fill="none" stroke-linecap="round"/>
