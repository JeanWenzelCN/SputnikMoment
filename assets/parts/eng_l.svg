  <ellipse cx="104" cy="39" rx="7" ry="7" fill="#2a3032" stroke="#9aa09b" stroke-width="1.6"/>
  <ellipse cx="176" cy="39" rx="17" ry="17" fill="url(#body)" stroke="#1b2123" stroke-width="4"/>
