    <circle cx="26" cy="174" r="2.2"/><circle cx="66" cy="174" r="2.2"/><circle cx="106" cy="174" r="2.2"/><circle cx="146" cy="174" r="2.2"/><circle cx="186" cy="174" r="2.2"/><circle cx="214" cy="174" r="2.2"/>
    <circle cx="26" cy="260" r="2.2"/><circle cx="66" cy="260" r="2.2"/><circle cx="106" cy="260" r="2.2"/><circle cx="146" cy="260" r="2.2"/><circle cx="186" cy="260" r="2.2"/><circle cx="214" cy="260" r="2.2"/>
