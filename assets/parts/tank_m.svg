<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="400" viewBox="0 0 240 400">
  <defs>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f4443"/>
      <stop offset="0.14" stop-color="#9ba19c"/>
      <stop offset="0.36" stop-color="#e2e5dd"/>
      <stop offset="0.56" stop-color="#c4c8c1"/>
      <stop offset="0.80" stop-color="#7b817e"/>
      <stop offset="1" stop-color="#343938"/>
