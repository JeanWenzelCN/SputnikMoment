name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4-stable"
  GODOT_TPL_DIR: "4.4.stable"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "SDK: $ANDROID_HOME"

      - name: Cache Godot toolchain
        uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v2

      - name: Fetch Godot editor and export templates
        run: |
          mkdir -p .tools
          if [ ! -x .tools/godot ]; then
            curl -fL --retry 3 --retry-delay 5 -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
            unzip -qo /tmp/godot.zip -d /tmp/godot_unpack
            mv "/tmp/godot_unpack/Godot_v${GODOT_VERSION}_linux.x86_64" .tools/godot
            chmod +x .tools/godot
          fi
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TPL_DIR}"
          if [ ! -f "$TPL_DIR/android_source.zip" ]; then
            curl -fL --retry 3 --retry-delay 5 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
            rm -rf /tmp/tpl && mkdir -p /tmp/tpl
            unzip -qo /tmp/templates.tpz -d /tmp/tpl
            mkdir -p "$TPL_DIR"
            cp -r /tmp/tpl/templates/. "$TPL_DIR"/
          fi
          .tools/godot --version

      - name: Configure Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project resources
        run: .tools/godot --headless --path . --import

      - name: Install Android build template
        run: .tools/godot --headless --path . --install-android-build-template

      - name: Smoke test (menu)
        run: |
          OUT=$(timeout 90 .tools/godot --headless --path . --quit-after 150 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -q "SCRIPT ERROR"; then
            echo "::error::GDScript runtime errors in menu"
            exit 1
          fi

      - name: Smoke test (flight)
        run: |
          OUT=$(timeout 90 .tools/godot --headless --path . --quit-after 200 -- --flight 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -q "SCRIPT ERROR"; then
            echo "::error::GDScript runtime errors in flight"
            exit 1
          fi

      - name: Export debug APK
        run: |
          mkdir -p build
          .tools/godot --headless --path . --export-debug "Android" "$PWD/build/SputnikMoment.apk"
          ls -l build
          test -f build/SputnikMoment.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sputnik-moment-apk
          path: build/SputnikMoment.apk
          if-no-files-found: error

      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly build/SputnikMoment.apk \
            --title "Sputnik Moment nightly" \
            --notes "Automated Android build from ${GITHUB_SHA:0:7}"
