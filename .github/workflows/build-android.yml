name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4-stable"
  GODOT_TPL_DIR: "4.4.stable"
  CMDLINE_TOOLS_URL: "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Heartbeat
        continue-on-error: true
        run: |
          mkdir -p ci
          echo "run ${GITHUB_RUN_NUMBER} started $(date -u)" > ci/status.txt
          git config user.email "ci@sputnik.local"
          git config user.name "Sputnik CI"
          git add -f ci/status.txt
          git commit -q -m "ci: heartbeat ${GITHUB_RUN_NUMBER}" || true
          git push -f origin HEAD:ci-log

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          mkdir -p ci
          {
            set -x
            export ANDROID_HOME="$HOME/android-sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL --retry 3 -o /tmp/cmdline.zip "$CMDLINE_TOOLS_URL"
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline
            mv /tmp/cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
            "$SDKM" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
            ls -la "$ANDROID_HOME"
          } 2>&1 | tee ci/sdk.log

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('export_presets.cfg') }}-v1

      - name: Cache Godot toolchain
        uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v2

      - name: Fetch Godot editor and export templates
        run: |
          mkdir -p ci .tools
          {
            if [ ! -x .tools/godot ]; then
              curl -fL --retry 3 --retry-delay 5 -o /tmp/godot.zip \
                "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
              unzip -qo /tmp/godot.zip -d /tmp/godot_unpack
              mv "/tmp/godot_unpack/Godot_v${GODOT_VERSION}_linux.x86_64" .tools/godot
              chmod +x .tools/godot
            fi
            TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TPL_DIR}"
            if [ ! -f "$TPL_DIR/android_source.zip" ]; then
              curl -fL --retry 3 --retry-delay 5 -o /tmp/templates.tpz \
                "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
              rm -rf /tmp/tpl && mkdir -p /tmp/tpl
              unzip -qo /tmp/templates.tpz -d /tmp/tpl
              mkdir -p "$TPL_DIR"
              cp -r /tmp/tpl/templates/. "$TPL_DIR"/
            fi
            .tools/godot --version
            ls "$TPL_DIR" | head -20
          } 2>&1 | tee ci/godot.log

      - name: Configure Godot editor settings
        run: |
          mkdir -p ci
          .tools/godot --headless --editor --path . --quit > /dev/null 2>&1 || true
          python3 - <<'PY'
          import glob, os

          home = os.environ["HOME"]
          sdk = os.environ.get("ANDROID_HOME", "")
          java = os.environ.get("JAVA_HOME", "")
          ks = os.path.join(home, ".android", "debug.keystore")

          files = sorted(glob.glob(os.path.join(home, ".config", "godot", "editor_settings-4*.tres")))
          path = files[0] if files else os.path.join(home, ".config", "godot", "editor_settings-4.4.tres")
          os.makedirs(os.path.dirname(path), exist_ok=True)

          text = ""
          if os.path.exists(path):
              with open(path) as handle:
                  text = handle.read()
          if "[resource]" not in text:
              text = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'

          values = {
              "export/android/android_sdk_path": sdk,
              "export/android/java_sdk_path": java,
              "export/android/debug_keystore": ks,
              "export/android/debug_keystore_user": "androiddebugkey",
              "export/android/debug_keystore_pass": "android",
          }
          for key, value in values.items():
              if key + " =" in text:
                  continue
              text += '%s = "%s"\n' % (key, value)

          with open(path, "w") as handle:
              handle.write(text)
          print("editor settings:", path)
          print(text)
          PY
          cp "$HOME/.config/godot/"editor_settings-4*.tres ci/editor_settings.tres

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" 2>&1 | tee ci/keystore.log

      - name: Import project resources
        run: |
          mkdir -p ci
          .tools/godot --headless --path . --import 2>&1 | tee ci/import.log

      - name: Extract Android build template
        run: |
          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TPL_DIR}"
          rm -rf android
          mkdir -p android/build
          unzip -q "$TPL_DIR/android_source.zip" -d android/build
          touch android/build/.gdignore
          ls android/build | head -20 | tee ci/template.log

      - name: Smoke test (menu)
        run: |
          OUT=$(timeout 90 .tools/godot --headless --path . --quit-after 150 2>&1) || true
          echo "$OUT" | tee ci/smoke-menu.log
          if echo "$OUT" | grep -q "SCRIPT ERROR"; then
            echo "::error::GDScript runtime errors in menu"
            exit 1
          fi

      - name: Smoke test (flight)
        run: |
          OUT=$(timeout 90 .tools/godot --headless --path . --quit-after 200 -- --flight 2>&1) || true
          echo "$OUT" | tee ci/smoke-flight.log
          if echo "$OUT" | grep -q "SCRIPT ERROR"; then
            echo "::error::GDScript runtime errors in flight"
            exit 1
          fi

      - name: Export debug APK
        run: |
          mkdir -p build ci
          {
            echo "--- editor settings ---"
            cat "$HOME/.config/godot/"editor_settings-4*.tres
            echo "--- keystore ---"
            ls -la "$HOME/.android"
            echo "--- templates ---"
            ls -la "$HOME/.local/share/godot/export_templates/${GODOT_TPL_DIR}" | head -25
          } 2>&1 | tee ci/diagnose.log
          .tools/godot --headless --verbose --path . --export-debug "Android" "$PWD/build/SputnikMoment.apk" 2>&1 | tee ci/export.log
          ls -l build
          test -f build/SputnikMoment.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sputnik-moment-apk
          path: build/SputnikMoment.apk
          if-no-files-found: error

      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly build/SputnikMoment.apk \
            --title "Sputnik Moment nightly" \
            --notes "Automated Android build from ${GITHUB_SHA:0:7}"

      - name: Publish CI report
        if: always()
        run: |
          mkdir -p ci
          {
            echo "run: ${GITHUB_RUN_NUMBER}"
            echo "job status: ${{ job.status }}"
            echo "sha: ${GITHUB_SHA}"
            java -version 2>&1 | head -2 || true
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            ls -la "${ANDROID_HOME:-/nonexistent}" 2>&1 | head -20 || true
            echo "--- build ---"
            ls -la build 2>&1 | head -20 || true
          } > ci/report.txt 2>&1
          git config user.email "ci@sputnik.local"
          git config user.name "Sputnik CI"
          git add -f ci
          git commit -q -m "ci: report ${GITHUB_RUN_NUMBER} (${{ job.status }})" || true
          git push -f origin HEAD:ci-log || echo "report push failed"